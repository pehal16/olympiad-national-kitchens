# ACME bootstrap only. Add as a separate vhost after inspecting the existing VPS.
# Do not replace nginx.conf or existing sites. This file exposes no application.
server {
    listen 80;
    server_name xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 503;
    }
}
