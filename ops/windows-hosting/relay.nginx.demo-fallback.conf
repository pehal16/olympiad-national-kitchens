# Olympiad-only ingress: retain the desktop as official primary, but serve an
# isolated anonymous demonstration if that desktop cannot accept a connection.
# Include in http context. Existing shop vhosts and databases are not changed.
upstream olympiad_public_demo {
    server olympiad-gkts.pages.dev:443;
    keepalive 16;
}
map $http_x_demo_session $olympiad_route {
    default http://127.0.0.1:13100;
    ~^[a-f0-9]{32}$ https://olympiad_public_demo;
}
map $http_x_demo_session $olympiad_host {
    default $host;
    ~^[a-f0-9]{32}$ olympiad-gkts.pages.dev;
}
map $http_x_demo_session $olympiad_cookie {
    default $http_cookie;
    ~^[a-f0-9]{32}$ "";
}
map $http_x_demo_session $olympiad_authorization {
    default $http_authorization;
    ~^[a-f0-9]{32}$ "";
}
map $http_x_demo_session $olympiad_forwarded_for {
    default $remote_addr;
    ~^[a-f0-9]{32}$ "";
}

server {
    listen 80;
    server_name xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai$request_uri; }
}
server {
    listen 443 ssl;
    server_name xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai;
    ssl_certificate /etc/letsencrypt/live/xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/olympiad-relay-error.log crit;
    client_max_body_size 1m;

    location ~* ^/(admin\.(html|js)|content-admin\.(html|js)|api/admin(/|$)) { return 404; }

    # Official organizer, mirror and other modules NEVER fall back to demo.
    location ~ ^/(organizer|api/(organizer|desktop-mirror|learning|pm01)(/|$)|pm01) {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        # An already-started demonstration keeps its isolated backend even if
        # the college PC returns while the visitor is answering questions.
        proxy_pass $olympiad_route;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name olympiad-gkts.pages.dev;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $olympiad_host;
        proxy_set_header Connection "";
        proxy_set_header Cookie $olympiad_cookie;
        proxy_set_header Authorization $olympiad_authorization;
        proxy_set_header X-Forwarded-For $olympiad_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @olympiad_demo;
    }

    location @olympiad_demo {
        # Never replay an unmarked official write to the demonstration DB.
        # Its new UI supplies X-Demo-Session; those requests route above.
        if ($request_method !~ ^(GET|HEAD)$) { return 503; }
        proxy_pass https://olympiad_public_demo;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name olympiad-gkts.pages.dev;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host olympiad-gkts.pages.dev;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Attempt-Token "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header X-Olympiad-Route anonymous-demonstration always;
    }
}
