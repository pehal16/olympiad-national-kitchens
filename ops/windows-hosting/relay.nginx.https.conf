# Final isolated vhost. Activate only with a verified certificate and SSH relay.
server {
    listen 80;
    server_name xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 301 https://xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai;
    ssl_certificate /etc/letsencrypt/live/xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # Keep participant URLs/tokens out of routine upstream-error logs.
    error_log /var/log/nginx/olympiad-relay-error.log crit;
    client_max_body_size 1m;

    location ~* ^/(admin\.(html|js)|content-admin\.(html|js)|api/admin(/|$)) {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
