# Final isolated vhost. Activate only with a verified certificate and SSH relay.
# This include is loaded inside nginx's http context. Cache only public images.
proxy_cache_path /var/cache/nginx/olympiad-images-v1 levels=1:2 keys_zone=olympiad_images:16m max_size=512m inactive=14d use_temp_path=off;

server {
    listen 80;
    server_name xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 301 https://xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai;
    ssl_certificate /etc/letsencrypt/live/xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aaloaqinm.xn--b1amqadnhd.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # Keep participant URLs/tokens out of routine upstream-error logs.
    error_log /var/log/nginx/olympiad-relay-error.log crit;
    client_max_body_size 1m;

    location ~* ^/(admin\.(html|js)|content-admin\.(html|js)|api/admin(/|$)) {
        return 404;
    }
    location ~ ^/(assets/olympiad/.*\.(webp|png|jpg|jpeg|svg)|icons/.*\.(png|svg)|brand-prof-tourism\.png|brand-prof-2024\.jpg|brand-gkts-shield\.jpg)$ {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Attempt-Token "";
        proxy_cache olympiad_images;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_lock_age 15s;
        proxy_cache_use_stale error timeout http_502 http_503 http_504 updating;
        proxy_cache_background_update on;
        proxy_buffering on;
        add_header X-Olympiad-Image-Cache $upstream_cache_status always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
