name = "olympiad-gkts-demo"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist-cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "olympiad-gkts-public-demo-20261025"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
OLYMPIAD_DEMO_MODE = "true"
STORY_ENABLED = "true"
STORY_ANYTIME_ENTRY = "true"
STORAGE_BACKEND = "cloudflare"
LEARNING_ENABLED = "false"
YANDEX_DISK_ENABLED = "false"
