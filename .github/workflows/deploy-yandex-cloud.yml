name: Deploy to Yandex Cloud

on:
  workflow_dispatch:
    inputs:
      repair_public_only:
        description: "Only restore unauthenticated public access to the current container"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      repair_api_gateway_id:
        description: "API Gateway id to resume when repair_public_only is true"
        required: true
        default: "d5df08olte300mnijq9s"
        type: string
      reset_pm01_attempts:
        description: "Delete all PM01 production attempts from all IP addresses before deploy"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
      YC_CONTAINER_NAME: ${{ secrets.YC_CONTAINER_NAME }}
      YC_RUNTIME_SERVICE_ACCOUNT_ID: ${{ secrets.YC_RUNTIME_SERVICE_ACCOUNT_ID }}
      YDB_CONNECTION_STRING: ${{ secrets.YDB_CONNECTION_STRING }}
      YDB_CONTENT_DRAFTS_TABLE: ${{ secrets.YDB_CONTENT_DRAFTS_TABLE }}
      YDB_CONTENT_QUESTIONS_TABLE: ${{ secrets.YDB_CONTENT_QUESTIONS_TABLE }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      YANDEX_DISK_ENABLED: ${{ secrets.YANDEX_DISK_ENABLED }}
      YANDEX_DISK_OAUTH_TOKEN: ${{ secrets.YANDEX_DISK_OAUTH_TOKEN }}
      YANDEX_DISK_FOLDER: ${{ secrets.YANDEX_DISK_FOLDER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        shell: bash
        run: |
          printf '%s' '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > key.json
          yc config profile create ci || true
          yc config profile activate ci
          yc config set service-account-key key.json
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Install Node dependencies for YDB deploy check
        shell: bash
        run: npm ci --omit=dev

      - name: Resolve active YDB connection string
        shell: bash
        run: |
          DB_LIST="$(yc ydb database list --format json)"
          DB_COUNT="$(printf '%s' "$DB_LIST" | jq 'length')"
          if [ "$DB_COUNT" -lt 1 ]; then
            echo "No YDB databases found in the configured folder." >&2
            exit 1
          fi

          DB_ID="$(printf '%s' "$DB_LIST" | jq -r '
            map(select((.status // .Status // "") != "STOPPED")) |
            .[0].id // .[0].Id // .[0].database_id // .[0].databaseId // empty
          ')"
          if [ -z "$DB_ID" ]; then
            DB_ID="$(printf '%s' "$DB_LIST" | jq -r '.[0].id // .[0].Id // .[0].database_id // .[0].databaseId // empty')"
          fi
          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve YDB database id." >&2
            printf '%s\n' "$DB_LIST" | jq '.[0] | keys'
            exit 1
          fi

          yc ydb database start "$DB_ID" || true
          for attempt in 1 2 3 4 5 6; do
            DB_STATUS="$(yc ydb database get --id "$DB_ID" --format json | jq -r '.status // .Status // empty')"
            echo "YDB database status: ${DB_STATUS:-unknown}"
            if [ "$DB_STATUS" = "RUNNING" ]; then
              break
            fi
            sleep 5
          done

          DB_INFO="$(yc ydb database get --id "$DB_ID" --format json)"
          ENDPOINT="$(printf '%s' "$DB_INFO" | jq -r '.endpoint // .Endpoint // empty')"
          LOCATION_ID="$(printf '%s' "$DB_INFO" | jq -r '.location_id // .locationId // empty')"
          FOLDER_ID="$(printf '%s' "$DB_INFO" | jq -r '.folder_id // .folderId // empty')"
          DB_NAME="$(printf '%s' "$DB_INFO" | jq -r '.name // .Name // empty')"
          DB_PATH="$(printf '%s' "$DB_INFO" | jq -r '.database_path // .databasePath // .path // .Path // .database // empty')"
          if [ -z "$ENDPOINT" ]; then
            ENDPOINT="$(printf '%s' "$DB_LIST" | jq -r --arg id "$DB_ID" '
              map(select((.id // .Id // .database_id // .databaseId) == $id))[0] |
              .endpoint // .Endpoint // empty
            ')"
          fi
          if [ -z "$LOCATION_ID" ]; then
            LOCATION_ID="$(printf '%s' "$DB_LIST" | jq -r --arg id "$DB_ID" '
              map(select((.id // .Id // .database_id // .databaseId) == $id))[0] |
              .location_id // .locationId // empty
            ')"
          fi
          if [ -z "$FOLDER_ID" ]; then
            FOLDER_ID="$(printf '%s' "$DB_LIST" | jq -r --arg id "$DB_ID" '
              map(select((.id // .Id // .database_id // .databaseId) == $id))[0] |
              .folder_id // .folderId // empty
            ')"
          fi
          if [ -z "$DB_NAME" ]; then
            DB_NAME="$(printf '%s' "$DB_LIST" | jq -r --arg id "$DB_ID" '
              map(select((.id // .Id // .database_id // .databaseId) == $id))[0] |
              .name // .Name // empty
            ')"
          fi
          if [ -z "$ENDPOINT" ]; then
            echo "Unable to resolve YDB endpoint." >&2
            printf '%s\n' "$DB_INFO" | jq 'keys'
            exit 1
          fi

          case "$ENDPOINT" in
            grpc://*|grpcs://*) ;;
            *) ENDPOINT="grpcs://$ENDPOINT" ;;
          esac

          YDB_TOKEN="$(yc iam create-token)"
          if [ -z "$YDB_TOKEN" ]; then
            echo "Unable to create IAM token for YDB connection check." >&2
            exit 1
          fi

          test_ydb_connection() {
            local candidate="$1"
            YDB_CONNECTION_STRING="$candidate" YDB_ACCESS_TOKEN_CREDENTIALS="$YDB_TOKEN" node <<'NODE'
          const { Driver } = require("@ydbjs/core");
          const { EnvironCredentialsProvider } = require("@ydbjs/auth/environ");

          (async () => {
            const connectionString = process.env.YDB_CONNECTION_STRING;
            const credentialsProvider = new EnvironCredentialsProvider(connectionString);
            const driver = new Driver(connectionString, {
              credentialsProvider,
              secureOptions: credentialsProvider.secureOptions
            });
            await driver.ready();
            if (typeof driver.destroy === "function") {
              await driver.destroy();
            }
          })().catch((error) => {
            console.error(error && error.message ? error.message : error);
            process.exit(1);
          });
          NODE
          }

          declare -a CANDIDATE_LABELS=()
          declare -a CANDIDATES=()

          add_candidate() {
            local label="$1"
            local path_value="$2"
            if [ -n "$path_value" ]; then
              CANDIDATE_LABELS+=("$label")
              CANDIDATES+=("${ENDPOINT}/?database=${path_value}")
            fi
          }

          if [ -n "${YDB_CONNECTION_STRING:-}" ]; then
            CANDIDATE_LABELS+=("secret")
            CANDIDATES+=("$YDB_CONNECTION_STRING")
          fi
          add_candidate "metadata-path" "$DB_PATH"
          add_candidate "location-cloud-id-database-id" "/${LOCATION_ID}/${YC_CLOUD_ID}/${DB_ID}"
          add_candidate "location-folder-id-database-id" "/${LOCATION_ID}/${FOLDER_ID}/${DB_ID}"
          add_candidate "location-cloud-id-database-name" "/${LOCATION_ID}/${YC_CLOUD_ID}/${DB_NAME}"
          add_candidate "location-folder-id-database-name" "/${LOCATION_ID}/${FOLDER_ID}/${DB_NAME}"

          RESOLVED_YDB_CONNECTION_STRING=""
          for index in "${!CANDIDATES[@]}"; do
            candidate="${CANDIDATES[$index]}"
            label="${CANDIDATE_LABELS[$index]}"
            echo "::add-mask::$candidate"
            echo "Checking YDB candidate: $label"
            if test_ydb_connection "$candidate"; then
              RESOLVED_YDB_CONNECTION_STRING="$candidate"
              echo "Selected YDB candidate: $label"
              break
            fi
          done

          if [ -z "$RESOLVED_YDB_CONNECTION_STRING" ]; then
            echo "No YDB connection candidate works for database id: $DB_ID" >&2
            exit 1
          fi

          echo "YDB_CONNECTION_STRING=$RESOLVED_YDB_CONNECTION_STRING" >> "$GITHUB_ENV"
          echo "Resolved active YDB database id: $DB_ID"

      - name: Install Node dependencies for PM01 reset
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.reset_pm01_attempts == 'true'
        shell: bash
        run: npm ci

      - name: Reset PM01 production attempts in YDB
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.reset_pm01_attempts == 'true'
        shell: bash
        run: |
          TOKEN="$(yc iam create-token)"
          if [ -z "$TOKEN" ]; then
            echo "Unable to create Yandex IAM token for YDB reset." >&2
            exit 1
          fi
          YDB_ACCESS_TOKEN_CREDENTIALS="$TOKEN" \
          CONFIRM_PM01_RESET=true \
          node scripts/reset-pm01-production-attempts.js pm01-2026-exam

      - name: Authorize Docker in Yandex Container Registry
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.repair_public_only != 'true'
        shell: bash
        run: |
          yc iam create-token | docker login --username iam --password-stdin cr.yandex

      - name: Build and push image
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.repair_public_only != 'true'
        shell: bash
        run: |
          REGISTRY_ID_CLEAN="$(printf '%s' "$YC_REGISTRY_ID" | tr -d '\r\n\t ')"
          IMAGE="cr.yandex/${REGISTRY_ID_CLEAN}/olympiad-national-kitchens:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          for attempt in 1 2 3 4; do
            if docker push "$IMAGE"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Docker push failed after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Ensure serverless container exists
        shell: bash
        run: |
          CONTAINER_NAME_CLEAN="$(printf '%s' "$YC_CONTAINER_NAME" | tr -d '\r\n\t ')"
          yc serverless container get --name "$CONTAINER_NAME_CLEAN" >/dev/null 2>&1 || \
          yc serverless container create --name "$CONTAINER_NAME_CLEAN"
          echo "CONTAINER_NAME_CLEAN=$CONTAINER_NAME_CLEAN" >> "$GITHUB_ENV"

      - name: Resume API Gateway in emergency repair mode
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.repair_public_only == 'true'
        shell: bash
        run: |
          GATEWAY_ID="$(printf '%s' '${{ github.event.inputs.repair_api_gateway_id }}' | tr -d '\r\n\t ')"
          yc serverless api-gateway resume --id "$GATEWAY_ID"

      - name: Deploy new revision
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.repair_public_only != 'true'
        shell: bash
        run: |
          yc serverless container revision deploy \
            --container-name "$CONTAINER_NAME_CLEAN" \
            --image "$IMAGE" \
            --cores 1 \
            --memory 512MB \
            --core-fraction 100 \
            --concurrency 8 \
            --execution-timeout 60s \
            --service-account-id "$YC_RUNTIME_SERVICE_ACCOUNT_ID" \
            --environment "HOST=0.0.0.0,STORAGE_BACKEND=ydb,YDB_CONNECTION_STRING=${YDB_CONNECTION_STRING},YDB_METADATA_CREDENTIALS=1,YDB_ATTEMPTS_TABLE=olympiad_attempts,YDB_ATTEMPT_VARIANTS_TABLE=olympiad_attempt_variants,YDB_ATTEMPT_ANSWERS_TABLE=olympiad_attempt_answers,YDB_ADMIN_SESSIONS_TABLE=admin_sessions,YDB_CONTENT_DRAFTS_TABLE=${YDB_CONTENT_DRAFTS_TABLE:-olympiad_content_drafts},YDB_CONTENT_QUESTIONS_TABLE=${YDB_CONTENT_QUESTIONS_TABLE:-olympiad_content_questions},YDB_PM01_VOICE_AUDIO_TABLE=olympiad_pm01_voice_audio,YDB_AUTO_CREATE_TABLES=true,ADMIN_PASSWORD=${ADMIN_PASSWORD},YANDEX_DISK_ENABLED=${YANDEX_DISK_ENABLED},YANDEX_DISK_OAUTH_TOKEN=${YANDEX_DISK_OAUTH_TOKEN},YANDEX_DISK_FOLDER=${YANDEX_DISK_FOLDER}"

      - name: Allow public access
        shell: bash
        run: |
          yc serverless container allow-unauthenticated-invoke --name "$CONTAINER_NAME_CLEAN" || true
