name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "data/**"
      - "config/**"
      - "scripts/build-cloudflare-pages.js"
      - "migrations/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CF_PAGES_PROJECT: olympiad-gkts
      CF_D1_DATABASE: olympiad-gkts-db
      CF_R2_BUCKET: olympiad-gkts-voice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Ensure Cloudflare resources
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets." >&2
            exit 1
          fi

          npx wrangler pages project create "$CF_PAGES_PROJECT" --production-branch main || true
          npx wrangler r2 bucket create "$CF_R2_BUCKET" || true

          DB_ID="$(npx wrangler d1 list --json | jq -r --arg name "$CF_D1_DATABASE" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$CF_D1_DATABASE"
            DB_ID="$(npx wrangler d1 list --json | jq -r --arg name "$CF_D1_DATABASE" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          fi
          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve Cloudflare D1 database id." >&2
            exit 1
          fi
          DB_ID="$DB_ID" node -e "const fs=require('fs');const p='wrangler.toml';let s=fs.readFileSync(p,'utf8');s=s.replace(/database_id = \"[^\"]*\"/, 'database_id = \"' + process.env.DB_ID + '\"');fs.writeFileSync(p,s);"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$CF_D1_DATABASE" --remote

      - name: Build Cloudflare Pages bundle
        run: npm run build:cloudflare

      - name: Configure Pages secret
        if: env.ADMIN_PASSWORD != ''
        shell: bash
        run: |
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler pages secret put ADMIN_PASSWORD --project-name "$CF_PAGES_PROJECT"

      - name: Deploy Pages
        run: npx wrangler pages deploy dist-cloudflare --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true
