name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "data/**"
      - "config/**"
      - "scripts/build-cloudflare-pages.js"
      - "scripts/verify-yandex-disk-storage.js"
      - "migrations/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      LEARNING_AUTH_SECRET: ${{ secrets.LEARNING_AUTH_SECRET }}
      LEARNING_BOOTSTRAP_SECRET: ${{ secrets.LEARNING_BOOTSTRAP_SECRET }}
      YANDEX_DISK_OAUTH_TOKEN: ${{ secrets.YANDEX_DISK_OAUTH_TOKEN }}
      YANDEX_DISK_FOLDER: ${{ secrets.YANDEX_DISK_FOLDER }}
      YANDEX_DISK_ENABLED: "true"
      CF_PAGES_PROJECT: olympiad-gkts
      CF_D1_DATABASE: olympiad-gkts-db

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Ensure Cloudflare resources
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || \
             [ -z "${ADMIN_PASSWORD:-}" ] || [ -z "${LEARNING_AUTH_SECRET:-}" ] || \
             [ -z "${LEARNING_BOOTSTRAP_SECRET:-}" ] || [ -z "${YANDEX_DISK_OAUTH_TOKEN:-}" ]; then
            echo "Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_PASSWORD, LEARNING_AUTH_SECRET, LEARNING_BOOTSTRAP_SECRET, and YANDEX_DISK_OAUTH_TOKEN repository secrets." >&2
            exit 1
          fi

          npx wrangler pages project create "$CF_PAGES_PROJECT" --production-branch main || true

          node scripts/verify-yandex-disk-storage.js

          DB_ID="$(npx wrangler d1 list --json | jq -r --arg name "$CF_D1_DATABASE" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$CF_D1_DATABASE"
            DB_ID="$(npx wrangler d1 list --json | jq -r --arg name "$CF_D1_DATABASE" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          fi
          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve Cloudflare D1 database id." >&2
            exit 1
          fi
          DB_ID="$DB_ID" node -e "const fs=require('fs');const p='wrangler.toml';let s=fs.readFileSync(p,'utf8');s=s.replace(/database_id = \"[^\"]*\"/, 'database_id = \"' + process.env.DB_ID + '\"');fs.writeFileSync(p,s);"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$CF_D1_DATABASE" --remote

      - name: Build Cloudflare Pages bundle
        run: npm run build:cloudflare

      - name: Configure Pages secrets
        shell: bash
        run: |
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler pages secret put ADMIN_PASSWORD --project-name "$CF_PAGES_PROJECT"
          printf '%s' "$LEARNING_AUTH_SECRET" | npx wrangler pages secret put LEARNING_AUTH_SECRET --project-name "$CF_PAGES_PROJECT"
          printf '%s' "$LEARNING_BOOTSTRAP_SECRET" | npx wrangler pages secret put LEARNING_BOOTSTRAP_SECRET --project-name "$CF_PAGES_PROJECT"
          printf '%s' "$YANDEX_DISK_OAUTH_TOKEN" | npx wrangler pages secret put YANDEX_DISK_OAUTH_TOKEN --project-name "$CF_PAGES_PROJECT"
          printf '%s' "$YANDEX_DISK_FOLDER" | npx wrangler pages secret put YANDEX_DISK_FOLDER --project-name "$CF_PAGES_PROJECT"
          printf '%s' "$YANDEX_DISK_ENABLED" | npx wrangler pages secret put YANDEX_DISK_ENABLED --project-name "$CF_PAGES_PROJECT"

      - name: Deploy Pages
        run: npx wrangler pages deploy dist-cloudflare --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true
