name: Recover learning administrator

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESET LEARNING ADMIN"
        required: true
        type: string

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEARNING_RECOVERY_PASSWORD_HASH: ${{ secrets.LEARNING_RECOVERY_PASSWORD_HASH }}
      LEARNING_RECOVERY_PASSWORD_SALT: ${{ secrets.LEARNING_RECOVERY_PASSWORD_SALT }}
      CF_D1_DATABASE: olympiad-gkts-db
      RECOVERY_LOGIN: gkts-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm ci

      - name: Validate recovery request
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "RESET LEARNING ADMIN" ]; then
            echo "Recovery confirmation does not match." >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || \
             [ -z "${LEARNING_RECOVERY_PASSWORD_HASH:-}" ] || [ -z "${LEARNING_RECOVERY_PASSWORD_SALT:-}" ]; then
            echo "Recovery secrets are missing." >&2
            exit 1
          fi

      - name: Reset the sole active administrator
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_JSON="$(npx wrangler d1 execute "$CF_D1_DATABASE" --remote --json --command \
            "SELECT DISTINCT u.id, u.login FROM learning_users u JOIN learning_user_roles r ON r.user_id=u.id WHERE r.role='admin' AND u.status='active' ORDER BY u.id;")"
          ADMIN_COUNT="$(printf '%s' "$ADMIN_JSON" | jq -r '.[0].results | length')"
          if [ "$ADMIN_COUNT" != "1" ]; then
            echo "Recovery requires exactly one active administrator; found $ADMIN_COUNT." >&2
            exit 1
          fi
          ADMIN_ID="$(printf '%s' "$ADMIN_JSON" | jq -r '.[0].results[0].id')"
          PREVIOUS_LOGIN="$(printf '%s' "$ADMIN_JSON" | jq -r '.[0].results[0].login')"
          CONFLICT_JSON="$(npx wrangler d1 execute "$CF_D1_DATABASE" --remote --json --command \
            "SELECT COUNT(*) AS total FROM learning_users WHERE login='$RECOVERY_LOGIN' COLLATE NOCASE AND id<>'$ADMIN_ID';")"
          CONFLICT_COUNT="$(printf '%s' "$CONFLICT_JSON" | jq -r '.[0].results[0].total')"
          if [ "$CONFLICT_COUNT" != "0" ]; then
            echo "The recovery login is already assigned to another user." >&2
            exit 1
          fi
          RECOVERY_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          AUDIT_ID="audit_recovery_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          cat > recovery.sql <<SQL
          BEGIN TRANSACTION;
          UPDATE learning_users
             SET login='$RECOVERY_LOGIN', updated_at='$RECOVERY_AT'
           WHERE id='$ADMIN_ID';
          UPDATE learning_credentials
             SET password_hash='$LEARNING_RECOVERY_PASSWORD_HASH',
                 password_salt='$LEARNING_RECOVERY_PASSWORD_SALT',
                 password_iterations=100000,
                 must_change_password=0,
                 updated_at='$RECOVERY_AT'
           WHERE user_id='$ADMIN_ID';
          UPDATE learning_sessions
             SET revoked_at='$RECOVERY_AT'
           WHERE user_id='$ADMIN_ID' AND revoked_at IS NULL;
          DELETE FROM learning_login_limits
           WHERE login_key='$PREVIOUS_LOGIN' COLLATE NOCASE OR login_key='$RECOVERY_LOGIN' COLLATE NOCASE;
          INSERT INTO learning_audit_events
            (id, actor_id, action, entity_type, entity_id, payload_json, created_at)
          VALUES
            ('$AUDIT_ID', '$ADMIN_ID', 'administrator.credential_recovered', 'user', '$ADMIN_ID',
             '{"source":"github_actions","sessions_revoked":true}', '$RECOVERY_AT');
          COMMIT;
          SQL
          npx wrangler d1 execute "$CF_D1_DATABASE" --remote --file recovery.sql
          rm -f recovery.sql
          echo "Learning administrator recovery completed."
