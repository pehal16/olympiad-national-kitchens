name: Tail learning API errors

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Tail production function errors
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_ID="$(npx --yes wrangler@4.128.0 pages deployment list --project-name olympiad-gkts --environment production --json | jq -r '.[0].Id')"
          test -n "$DEPLOYMENT_ID"
          npx --yes wrangler@4.128.0 pages deployment tail "$DEPLOYMENT_ID" \
            --project-name olympiad-gkts \
            --format pretty \
            --status error \
            --method POST
