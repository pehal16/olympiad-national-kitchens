name: Tail learning API errors

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Tail production function errors
        run: >-
          npx --yes wrangler@4.20.0 pages deployment tail
          --project-name olympiad-gkts
          --environment production
          --format pretty
          --status error
          --method POST
