name: Restaurant story isolated preview
on:
  workflow_dispatch:
  push:
    branches: [codex/restaurant-story]
concurrency:
  group: restaurant-story-isolated-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/provision-story-preview.js
      - run: npx wrangler d1 migrations apply olympiad-gkts-story-preview-db --remote --env preview
      - run: npm run build:cloudflare
      - name: Deploy preview and record URL
        run: node scripts/deploy-story-preview.js
      - name: Full 50 and 60 participant rehearsals
        run: node scripts/verify-story-preview.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restaurant-story-preview-evidence
          path: output/story/cloudflare-*.json
